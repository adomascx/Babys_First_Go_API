openapi: 3.1.1
info:
  title: Skelbiu API
  description: |
    API that exposes scraped skelbiu.lt listings
  version: 1.0.0

servers:
  - url: https://skelbiu-api.onrender.com
    description: Production server (Deployed on Render)
  - url: http://localhost:8080
    description: Local development server

paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string
              example: "OK"

  /listings:
    get:
      summary: Returns a list of listings
      description: |
        Returns scraped listings as a JSON array. API client's query must match documented parameters.
      parameters:
        - $ref: "#/components/parameters/Keyword"
        - $ref: "#/components/parameters/Cities"
        - $ref: "#/components/parameters/CategoryID"
        - $ref: "#/components/parameters/ListingOrigin"
        - $ref: "#/components/parameters/OrderBy"
        - $ref: "#/components/parameters/MinCost"
        - $ref: "#/components/parameters/MaxCost"
        - $ref: "#/components/parameters/IsSeller"
        - $ref: "#/components/parameters/ConditionType"
        - $ref: "#/components/parameters/Pages"

      responses:
        "200":
          description: A JSON array of listings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Listing"
              examples:
                sample:
                  summary: Short sample response
                  value:
                    - link: "https://skelbiu.lt/skelbimai/example"
                      title: "Sample Listing"
                      description: "A sample description"
                      date: "2026-06-08"
                      price: 123.45

        "400":
          description: Invalid query parameters
          content:
            text/plain:
              schema:
                type: string
              example: "invalid query"

        "500":
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
              example: "failed to scrape"

components:
  parameters:
    Keyword:
      name: Keyword
      in: query
      description: Search bar keywords
      required: false
      schema:
        type: string

    Cities:
      name: Cities
      in: query
      description: Comma-separated city IDs
      required: false
      schema:
        type: string
      example: "465,43"

    CategoryID:
      name: CategoryID
      in: query
      description: Specific category ID
      required: true
      schema:
        type: integer
        minimum: 0
        maximum: 1132

    ListingOrigin:
      name: ListingOrigin
      in: query
      description: |
        Lister origin:
        - 0 = either
        - 1 = private
        - 2 = organization
      required: false
      schema:
        type: integer
        enum: [0, 1, 2]

    OrderBy:
      name: OrderBy
      in: query
      description: |
        Ordering of listings:
        - 0 = updated
        - 1 = newest
        - 2 = best
        - 3 = cheapest
        - 8 = most expensive
      required: false
      schema:
        type: integer
        enum: [0, 1, 2, 3, 8]

    MinCost:
      name: MinCost
      in: query
      description: Minimum price in EUR
      required: false
      schema:
        type: number
        format: float

    MaxCost:
      name: MaxCost
      in: query
      description: Maximum price in EUR
      required: false
      schema:
        type: number
        format: float

    IsSeller:
      name: IsSeller
      in: query
      description: |
        Seller/Buyer flag:
        - 0 = seller or buyer
        - 1 = seller
        - 2 = buyer
      required: false
      schema:
        type: integer
        enum: [0, 1, 2]

    ConditionType:
      name: ConditionType
      in: query
      description: |
        Condition type:
        - 0 = either
        - 1 = new
        - 2 = used
      required: false
      schema:
        type: integer
        enum: [0, 1, 2]

    Pages:
      name: Pages
      in: query
      description: |
        Number of pages to scrape.
        If omitted or set to 0, defaults to 5 pages.
      required: false
      schema:
        type: integer
        default: 5

  schemas:
    Listing:
      type: object
      properties:
        link:
          type: string
          format: uri
        title:
          type: string
        description:
          type: string
        date:
          type: string
        price:
          type: number
          format: float